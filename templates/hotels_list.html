{% for hotel in hotels %}
<div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm position-relative">

        {% if user.is_authenticated %}
        <i class="wishlist-icon position-absolute top-0 end-0 p-2 fs-4"
           data-hotel-id="{{ hotel.id }}"
           style="cursor:pointer;">
            {% if hotel.id in wishlist_ids %}
                <span class="fa-solid fa-heart text-danger"></span>
            {% else %}
                <span class="fa-regular fa-heart text-dark"></span>
            {% endif %}
        </i>
        {% endif %}

        {% if hotel.images.first %}
            <img src="{{ hotel.images.first.image.url }}" class="card-img-top"
                 style="height:220px; object-fit:cover;">
        {% endif %}

        <div class="card-body d-flex flex-column">
            <h5 class="fw-bold text-center mb-0">{{ hotel.name }}</h5>
            <small class="text-muted text-center">{{ hotel.get_category_display }}</small>
            <small class="text-muted text-center mb-2">{{ hotel.city }}</small>
            <a href="{% url 'hotel_detail' hotel.id %}" class="btn btn-dark btn-sm mt-auto">
                View Details
            </a>
        </div>
    </div>
</div>
{% empty %}
<p class="text-center text-muted">No hotels found.</p>
{% endfor %}
