{% extends 'base.html' %}
{% block content %}

<h3 class="text-center">Reset Password</h3>
<hr>

<form method="post" id="resetForm" class="mx-auto" style="max-width:400px;" novalidate>
    {% csrf_token %}

    <div class="mb-3">
        <label>New Password</label>
        <input type="password" name="password1" class="form-control" maxlength="8" required>
        <div id="passwordStrength" style="font-size: 13px; margin-top: 5px;"></div>
    </div>

    <div class="mb-3">
        <label>Confirm Password</label>
        <input type="password" name="password2" class="form-control" maxlength="8" required>
    </div>

    <!-- 🔥 BUTTON CHANGE -->
    <button type="button" onclick="handleReset()" class="btn btn-dark w-100">
        Update Password
    </button>
</form>

<!-- 🔥 TOP POPUP -->
<div id="topPopup" class="top-popup">
    <span id="popupText"></span>
</div>

<!-- 🔥 DJANGO MESSAGES -->
{% if messages %}
<script>
    {% for message in messages %}
        showPopup("{{ message }}");
    {% endfor %}
</script>
{% endif %}

<!-- 🔥 JS -->
<script>
function handleReset() {
    let inputs = document.querySelectorAll("#resetForm [required]");
    let valid = true;

    inputs.forEach(input => {
        if (!input.value.trim()) {
            input.style.border = "2px solid red";
            valid = false;
        } else {
            input.style.border = "";
        }
    });

    let password = document.querySelector('[name="password1"]').value;
    let confirm = document.querySelector('[name="password2"]').value;

    // 🔥 MAX LENGTH
    if (password.length > 8) {
        showPopup("Password must be maximum 8 characters!");
        return;
    }

    // 🔐 STRONG PASSWORD
    let strongPattern = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{6,8}$/;

    if (!strongPattern.test(password)) {
        showPopup("Password must be 6-8 chars with uppercase, lowercase, number & symbol!");
        return;
    }

    if (password !== confirm) {
        showPopup("Passwords do not match!");
        return;
    }

    if (!valid) {
        showPopup("Please fill all required fields!");
        return;
    }

    document.getElementById("resetForm").submit();
}

// 🔥 PASSWORD STRENGTH
document.querySelector('[name="password1"]').addEventListener("input", function() {
    let val = this.value;
    let msg = document.getElementById("passwordStrength");

    if (val.length < 6) {
        msg.innerHTML = "Weak ❌";
        msg.style.color = "red";
    } 
    else if (val.match(/[A-Z]/) && val.match(/\d/)) {
        msg.innerHTML = "Medium ⚠️";
        msg.style.color = "orange";
    } 
    else if (val.match(/[A-Z]/) && val.match(/[a-z]/) && val.match(/\d/) && val.match(/[@$!%*?&]/)) {
        msg.innerHTML = "Strong ✅";
        msg.style.color = "green";
    } 
    else {
        msg.innerHTML = "";
    }
});

// 🔥 POPUP
function showPopup(message) {
    const popup = document.getElementById("topPopup");
    document.getElementById("popupText").innerText = message;

    popup.classList.add("show");

    setTimeout(() => {
        popup.classList.remove("show");
    }, 3000);
}
</script>

<!-- 🔥 STYLE -->
<style>
.top-popup {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #ff4d4d;
    color: #fff;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: 500;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    z-index: 9999;
    transition: 0.4s ease;
}

.top-popup.show {
    transform: translateX(-50%) translateY(0);
}
</style>

{% endblock %}
